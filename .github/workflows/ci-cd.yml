name: Build, Push and Deploy to EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: my-cluster
  APP_NAME: html-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/html-app:latest 
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/html-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Update deployment image
        run: |
          sed -i "s|{{IMAGE}}|${{ secrets.DOCKERHUB_USERNAME }}/html-app:latest|g" deployment.yaml
          sed -i "s|{{APP_NAME}}|${APP_NAME}|g" deployment.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -f deployment.yaml
          kubectl rollout status deployment/${APP_NAME}
